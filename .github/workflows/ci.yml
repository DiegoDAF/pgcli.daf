name: pgcli

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '**.rst'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        postgres: ["16"]
        include:
          # The servers this fork works against are 17 and 18: one job on the
          # newest server catches the differences (restrict keys, EXPLAIN
          # fields) that the 16 image cannot show.
          - python-version: "3.14"
            postgres: "18"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
            - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pgbouncer
        run: |
            sudo apt-get update
            sudo apt install pgbouncer -y

            sudo chmod 666 /etc/pgbouncer/*.*

            cat <<EOF > /etc/pgbouncer/userlist.txt
            "postgres" "postgres"
            EOF

            cat <<EOF > /etc/pgbouncer/pgbouncer.ini
            [databases]
            * = host=localhost port=5432
            [pgbouncer]
            listen_port = 6432
            listen_addr = localhost
            auth_type = trust
            auth_file = /etc/pgbouncer/userlist.txt
            logfile = pgbouncer.log
            pidfile = pgbouncer.pid
            admin_users = postgres
            EOF

            sudo systemctl stop pgbouncer

            pgbouncer -d /etc/pgbouncer/pgbouncer.ini

            psql -h localhost -U postgres -p 6432 pgbouncer -c 'show help'

      - name: Install the PostgreSQL ${{ matrix.postgres }} client tools
        # The image ships the 16 client only and drops the PGDG repository after
        # installing it; pg_dump refuses a newer server ("aborting because of
        # server version mismatch"), so the dump wrapper scenarios need the
        # client of this job's server. PATH goes first because /usr/bin/pg_dump
        # is pg_wrapper, which ignores -h and picks the version of the image's
        # own 16 cluster on port 5432, not the newest client installed.
        run: |
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get install -y postgresql-client-${{ matrix.postgres }}
            echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"

      - name: Install requirements
        run: uv sync --all-extras -p ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run tox -e py${{ matrix.python-version }}

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run integration tests
        env:
            PGUSER: postgres
            PGPASSWORD: postgres
            TERM: xterm

        run: uv run tox -e integration

      - name: Check changelog for ReST compliance
        run: uv run tox -e rest

      - name: Run style checks
        run: uv run tox -e style

      - name: Run type checks
        run: uv run tox -e mypy

  windows:
    # Service containers do not run on Windows runners, so this job starts the
    # PostgreSQL the image ships (service disabled, user postgres, password
    # root). Unit tests only: behave drives pgcli through pexpect.spawn, which
    # does not exist on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Start PostgreSQL
        run: |
          $pg = Get-Service -Name "postgresql*"
          Set-Service -InputObject $pg -StartupType Manual
          Start-Service -InputObject $pg
          & "$env:PGBIN\pg_isready.exe" --timeout 30
          # pg_isready, pg_dump and pg_dumpall for the wrapper tests
          Add-Content -Path $env:GITHUB_PATH -Value $env:PGBIN

      - name: Install requirements
        run: uv sync --all-extras -p 3.13

      - name: Run unit tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: root
        run: uv run tox -e py3.13
